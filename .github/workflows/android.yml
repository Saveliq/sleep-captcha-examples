name: Build Debug APK (final + support-annotations)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (accept licenses)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Clone sleep-captcha-support sources
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/urbandroid-team/sleep-captcha-support.git captcha-lib-src

      - name: Patch Gradle files and wire local library
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "sleep-captcha-examples"
          include(":app")
          include(":captcha-support-lib")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "7.4.2" apply false
              id "com.android.library" version "7.4.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.urbandroid.sleep.captcha.examples"
              compileSdk 33

              defaultConfig {
                  applicationId "com.urbandroid.sleep.captcha.examples"
                  minSdk 21
                  targetSdk 30
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation project(":captcha-support-lib")
          }
          EOF

          mkdir -p captcha-support-lib/src/main

          cat > captcha-support-lib/build.gradle <<'EOF'
          plugins {
              id "com.android.library"
          }

          android {
              namespace "com.urbandroid.sleep.captcha"
              compileSdk 33

              defaultConfig {
                  minSdk 14
                  targetSdk 30
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              // дает android.support.annotation.* (IntDef/StringDef/NonNull/Nullable/CallSuper и т.д.)
              compileOnly "com.android.support:support-annotations:28.0.0"
          }
          EOF

          SRC_JAVA_FILE="$(find captcha-lib-src -type f -name 'CaptchaSupport.java' | head -n 1 || true)"
          if [ -z "$SRC_JAVA_FILE" ]; then
            echo "ERROR: CaptchaSupport.java not found in cloned library" >&2
            exit 1
          fi

          SRC_MAIN_DIR="$(echo "$SRC_JAVA_FILE" | sed 's|\(.*\/src\/main\).*|\1|')"
          if [ ! -d "$SRC_MAIN_DIR" ]; then
            echo "ERROR: computed src/main dir not found: $SRC_MAIN_DIR" >&2
            exit 1
          fi

          echo "Using library src/main from: $SRC_MAIN_DIR"
          cp -R "$SRC_MAIN_DIR"/* captcha-support-lib/src/main/

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          if-no-files-found: error
          path: |
            **/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/debug/*.apk
