name: Build Debug APK (FINAL AndroidX patch)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Clone library
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/urbandroid-team/sleep-captcha-support.git captcha-lib-src

      - name: Patch project + build
        shell: bash
        run: |
          set -euo pipefail

          # --------------------
          # Gradle settings
          # --------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "sleep-captcha-examples"
          include(":app")
          include(":captcha-support-lib")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "7.4.2" apply false
              id "com.android.library" version "7.4.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # --------------------
          # App module
          # --------------------
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.urbandroid.sleep.captcha.examples"
              compileSdk 33

              defaultConfig {
                  applicationId "com.urbandroid.sleep.captcha.examples"
                  minSdk 21
                  targetSdk 30
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug { minifyEnabled false }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation project(":captcha-support-lib")
          }
          EOF

          # --------------------
          # Local library module
          # --------------------
          mkdir -p captcha-support-lib/src/main
          cat > captcha-support-lib/build.gradle <<'EOF'
          plugins {
              id "com.android.library"
          }

          android {
              namespace "com.urbandroid.sleep.captcha"
              compileSdk 33

              defaultConfig {
                  minSdk 14
                  targetSdk 30
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              // AndroidX annotations replacement for old android.support.annotation.*
              api "androidx.annotation:annotation:1.9.1"
          }
          EOF

          # --------------------
          # Copy upstream src/main into module
          # --------------------
          SRC_JAVA_FILE="$(find captcha-lib-src -type f -name 'CaptchaSupport.java' | head -n 1 || true)"
          if [ -z "$SRC_JAVA_FILE" ]; then
            echo "ERROR: CaptchaSupport.java not found in cloned library" >&2
            exit 1
          fi

          SRC_MAIN_DIR="$(echo "$SRC_JAVA_FILE" | sed 's|\(.*\/src\/main\).*|\1|')"
          if [ ! -d "$SRC_MAIN_DIR" ]; then
            echo "ERROR: computed src/main dir not found: $SRC_MAIN_DIR" >&2
            exit 1
          fi

          cp -R "$SRC_MAIN_DIR"/* captcha-support-lib/src/main/

          # --------------------
          # AndroidX migrate: replace imports
          # --------------------
          if [ -d "captcha-support-lib/src/main/java" ]; then
            FILES="$(grep -RIl --include='*.java' 'android\.support\.annotation' captcha-support-lib/src/main/java || true)"
            if [ -n "$FILES" ]; then
              echo "$FILES" | while read -r f; do
                sed -i 's/android\.support\.annotation/androidx.annotation/g' "$f"
              done
            fi
          fi

          # --------------------
          # Build
          # --------------------
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          if-no-files-found: error
          path: |
            **/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/debug/*.apk
