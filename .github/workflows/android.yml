name: Build Debug APK (WORKING FINAL)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Build (patch everything on the fly)
        shell: bash
        run: |
          set -euo pipefail

          # -------- clone captcha-support sources --------
          git clone --depth 1 https://github.com/urbandroid-team/sleep-captcha-support.git captcha-lib-src

          # -------- Gradle: settings/root --------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "sleep-captcha-examples"
          include(":app")
          include(":captcha-support-lib")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "7.4.2" apply false
              id "com.android.library" version "7.4.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # -------- app/build.gradle (IMPORTANT: namespace = manifest package) --------
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.urbandroid.sleep.captcha.example"
              compileSdk 33

              defaultConfig {
                  applicationId "com.urbandroid.sleep.captcha.example"
                  minSdk 21
                  targetSdk 30
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug { minifyEnabled false }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation project(":captcha-support-lib")
          }
          EOF

          # -------- create local library module --------
          mkdir -p captcha-support-lib/src/main
          cat > captcha-support-lib/build.gradle <<'EOF'
          plugins {
              id "com.android.library"
          }

          android {
              namespace "com.urbandroid.sleep.captcha"
              compileSdk 33

              defaultConfig {
                  minSdk 14
                  targetSdk 30
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              api "androidx.annotation:annotation:1.9.1"
          }
          EOF

          # copy upstream src/main into our module
          SRC_JAVA_FILE="$(find captcha-lib-src -type f -name 'CaptchaSupport.java' | head -n 1 || true)"
          if [ -z "$SRC_JAVA_FILE" ]; then
            echo "ERROR: CaptchaSupport.java not found in cloned library" >&2
            exit 1
          fi
          SRC_MAIN_DIR="$(echo "$SRC_JAVA_FILE" | sed 's|\(.*\/src\/main\).*|\1|')"
          cp -R "$SRC_MAIN_DIR"/* captcha-support-lib/src/main/

          # migrate library annotations imports: android.support.annotation.* -> androidx.annotation.*
          LIB_FILES="$(grep -RIl --include='*.java' 'android\.support\.annotation' captcha-support-lib/src/main/java || true)"
          if [ -n "$LIB_FILES" ]; then
            echo "$LIB_FILES" | while read -r f; do
              sed -i 's/android\.support\.annotation/androidx.annotation/g' "$f"
            done
          fi

          # -------- FIX YOUR APP PACKAGE (R class is generated in namespace package) --------
          # if any of your custom activities were created in "...captcha.examples", compile will fail
          APP_FILES="$(find app/src/main/java -type f -name '*.java' || true)"
          if [ -n "$APP_FILES" ]; then
            echo "$APP_FILES" | while read -r f; do
              sed -i 's/^package com\.urbandroid\.sleep\.captcha\.examples;/package com.urbandroid.sleep.captcha.example;/' "$f"
            done
          fi

          # -------- build --------
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          if-no-files-found: error
          path: |
            **/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/debug/*.apk
