name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate gradlew
        id: locate
        shell: bash
        run: |
          set -e
          echo "Repo root:"
          ls -la

          WRAPPER="$(find . -maxdepth 5 -type f -name gradlew | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in repository (searched up to depth 5)." >&2
            echo "Hint: you need to commit Gradle Wrapper files into the repo." >&2
            exit 1
          fi

          WRAPPER_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"
          echo "Found gradlew at: $WRAPPER"
          echo "Wrapper dir: $WRAPPER_DIR"

          echo "wrapper_path=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "wrapper_dir=$WRAPPER_DIR" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x "${{ steps.locate.outputs.wrapper_path }}"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.wrapper_dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/build/outputs/apk/**/debug/*.apk
            **/build/outputs/apk/debug/*.apk
