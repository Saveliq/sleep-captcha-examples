plugins {
    id "com.android.application"
}

android {
    namespace "com.urbandroid.sleep.captcha.example"
    compileSdk 34

    defaultConfig {
        applicationId "com.urbandroid.sleep.captcha.example"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            // НЕ добавляй applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(":captcha-support-lib")
}
